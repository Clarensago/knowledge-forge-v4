<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERV — 知識加工廠 v4</title>
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #12121C;
    --surface2: #1C1C2E;
    --border: #2A2A3C;
    --text: #E8E8EC;
    --text2: #6B6B80;
    --primary: #E7410F;
    --primary-hover: #FF5722;
    --accent: #F5A623;
    --green: #00E676;
    --red: #FF1744;
    --yellow: #FFD600;
    --blue: #448AFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
    background: var(--bg); color: var(--text); min-height: 100vh;
    overflow-x: hidden;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

  /* ══════ DASHBOARD ══════ */
  .dashboard {
    background: linear-gradient(180deg, #101018 0%, var(--surface) 100%);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 0; margin-bottom: 20px; position: relative; overflow: hidden;
  }
  .dash-title-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  .dash-title-left { display: flex; align-items: center; gap: 12px; }
  .dash-title-left h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--primary); }
  .dash-title-left h1 .sub { color: var(--text2); font-size: 13px; font-weight: 400; margin-left: 8px; letter-spacing: 0; }
  .dash-title-right { display: flex; align-items: center; gap: 24px; }
  .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text2); box-shadow: 0 0 6px var(--text2); }
  .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green), 0 0 20px rgba(0,230,118,0.3); animation: dotPulse 1.5s ease-in-out infinite; }
  .status-dot.suspended { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
  @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .gauge-row { display: flex; gap: 16px; }
  .gauge { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
  .gauge .g-val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .gauge .g-label { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-top: 3px; }

  /* Target Area */
  .dash-target { padding: 16px 24px 12px; display: none; }
  .dashboard.active .dash-target { display: block; }
  .target-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .target-book { font-size: 16px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-shadow: 0 0 12px rgba(245,166,35,0.3); }
  .stage-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; background: var(--primary); color: #fff; box-shadow: 0 0 12px rgba(231,65,15,0.3); }

  /* Progress Bar */
  .dash-progress { padding: 8px 24px 16px; display: none; }
  .dashboard.active .dash-progress { display: block; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-pct { font-size: 14px; font-weight: 700; color: var(--primary); min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  .progress-bar-bg { flex: 1; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; position: relative; }
  .progress-bar-fill { height: 100%; border-radius: 5px; background: repeating-linear-gradient(-45deg, var(--primary), var(--primary) 10px, var(--accent) 10px, var(--accent) 20px); background-size: 28.28px 100%; transition: width 0.6s ease; }
  .progress-bar-fill.animated { animation: barberPole 0.8s linear infinite; }
  @keyframes barberPole { 0% { background-position: 0 0; } 100% { background-position: 28.28px 0; } }
  .progress-segments { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; pointer-events: none; }
  .progress-seg-mark { height: 100%; border-right: 1px solid rgba(255,255,255,0.15); }
  .progress-info { display: flex; align-items: center; gap: 8px; }
  .progress-chapter { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .progress-eta { font-size: 11px; color: var(--accent); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .progress-detail { padding: 4px 24px 8px; display: none; font-size: 10px; color: var(--text2); }
  .dashboard.active .progress-detail { display: flex; gap: 16px; align-items: center; }
  .progress-stage-info { display: flex; gap: 12px; }
  .stage-step { color: var(--blue); font-weight: 600; }
  .stage-avg { color: var(--text2); }

  /* Broadcast Panel */
  .dash-broadcast { padding: 0 24px 16px; display: none; }
  .dashboard.active .dash-broadcast { display: block; }
  .broadcast-panel { background: linear-gradient(180deg, #080A10 0%, #0C0E16 100%); border: 1px solid rgba(231,65,15,0.15); border-radius: 8px; padding: 0; max-height: 210px; overflow: hidden; position: relative; }
  .broadcast-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 36px; background: linear-gradient(180deg, #080A10, transparent); z-index: 2; pointer-events: none; }
  .broadcast-inner { padding: 16px; overflow-y: auto; max-height: 210px; scroll-behavior: smooth; }
  .broadcast-inner::-webkit-scrollbar { width: 4px; }
  .broadcast-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .bc-line { padding: 2px 0; font-size: 12px; line-height: 1.8; animation: bcIn 0.4s ease-out; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes bcIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .bc-time { color: #444860; }
  .bc-tag { font-weight: 600; margin: 0 4px; }
  .bc-system { color: var(--primary); }
  .bc-stage { color: var(--blue); }
  .bc-success { color: var(--green); }
  .bc-error { color: var(--red); }
  .bc-chapter { color: var(--accent); }
  .bc-info { color: var(--text2); }
  .bc-cursor { display: inline-block; width: 7px; height: 14px; vertical-align: middle; background: var(--green); margin-left: 4px; animation: cursorBlink 1s step-end infinite; }
  @keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* Standby */
  .dash-standby { padding: 20px 24px; text-align: center; font-size: 13px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; }
  .dashboard.active .dash-standby { display: none; }
  .dashboard:not(.active) .dash-standby { display: block; }

  /* Control Bar */
  .control-bar { padding: 12px 24px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--border); }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: none; border-radius: 6px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; color: #fff; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-primary { background: var(--primary); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 0 16px rgba(231,65,15,0.4); }
  .btn-red { background: var(--red); }
  .btn-red:hover:not(:disabled) { box-shadow: 0 0 16px rgba(255,23,68,0.4); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 10px; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .inbox-hint { font-size: 11px; color: var(--text2); }
  .inbox-hint code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; color: var(--accent); }

  /* Lower Panels */
  .lower-grid { display: grid; grid-template-columns: 55fr 45fr; gap: 20px; }
  @media (max-width: 800px) { .lower-grid { grid-template-columns: 1fr; } }

  /* Queue Card */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .queue-list { list-style: none; }
  .queue-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 8px; margin-bottom: 5px; background: var(--surface2); transition: all 0.3s; cursor: grab; border-left: 3px solid transparent; }
  .queue-item:hover { background: #24283A; }
  .queue-item.processing { background: linear-gradient(135deg, rgba(231,65,15,0.12), rgba(245,166,35,0.06)); border-left: 4px solid var(--primary); animation: processingGlow 2s ease-in-out infinite; }
  @keyframes processingGlow { 0%,100% { box-shadow: 0 0 4px rgba(231,65,15,0.15); } 50% { box-shadow: 0 0 16px rgba(231,65,15,0.3); } }
  .queue-item.done { border-left-color: var(--green); opacity: 0.6; }
  .queue-item.failed { border-left-color: var(--red); opacity: 0.7; }
  .queue-item-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .queue-item-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item-meta { font-size: 10px; color: var(--text2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .badge-pending { background: var(--surface); color: var(--text2); }
  .badge-processing { background: rgba(231,65,15,0.2); color: var(--primary); }
  .badge-done { background: rgba(0,230,118,0.15); color: var(--green); }
  .badge-failed { background: rgba(255,23,68,0.15); color: var(--red); }
  .drag-handle { cursor: grab; color: var(--text2); font-size: 14px; user-select: none; padding: 0 4px; }
  .drag-handle:active { cursor: grabbing; }
  .queue-item.dragging { opacity: 0.3; }
  .queue-item.drag-over { border-top: 2px solid var(--primary); }

  /* Terminal */
  .terminal { background: #08090E; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .terminal-header { background: #0E1018; padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .t-dot { width: 10px; height: 10px; border-radius: 50%; }
  .t-dot.r { background: var(--primary); }
  .t-dot.y { background: var(--accent); }
  .t-dot.g { background: var(--green); opacity: 0.7; }
  .terminal-title { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-left: 4px; }
  .terminal-body { padding: 14px; flex: 1; max-height: 340px; overflow-y: auto; font-size: 11.5px; line-height: 1.7; color: var(--text2); }
  .terminal-body::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .t-line { animation: tLineIn 0.3s ease-out; white-space: pre-wrap; word-break: break-all; }
  @keyframes tLineIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
  .t-cursor { display: inline-block; width: 7px; height: 13px; vertical-align: middle; background: var(--green); animation: cursorBlink 1s step-end infinite; }
  .empty-state { text-align: center; padding: 32px; color: var(--text2); font-size: 12px; letter-spacing: 0.5px; }
  .hidden { display: none !important; }

  /* Concurrency */
  .concurrency-ctrl { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .concurrency-ctrl label { white-space: nowrap; font-weight: 600; letter-spacing: 0.5px; }
  .concurrency-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; border-radius: 2px; background: var(--surface2); outline: none; }
  .concurrency-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 6px rgba(231,65,15,0.4); }
  .concurrency-val { font-size: 14px; font-weight: 700; color: var(--primary); min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }

  /* Settings Modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; min-width: 400px; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 20px; letter-spacing: 0.5px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .modal-field input { width: 100%; padding: 8px 12px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; }
  .modal-field input:focus { outline: none; border-color: var(--primary); }
  .modal-field .field-hint { font-size: 10px; color: var(--text2); margin-top: 4px; }
  .modal-field .field-status { font-size: 11px; margin-top: 4px; }
  .modal-field .field-status.ok { color: var(--green); }
  .modal-field .field-status.missing { color: var(--red); }
  .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal-btns .btn { min-width: 80px; text-align: center; }
  .btn-settings { background: none; border: 1px solid var(--border); color: var(--text2); padding: 4px 12px; border-radius: 6px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s; }
  .btn-settings:hover { border-color: var(--primary); color: var(--primary); }
  .btn-settings.no-key { border-color: var(--red); color: var(--red); animation: keyPulse 2s ease-in-out infinite; }
  @keyframes keyPulse { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 8px rgba(255,23,68,0.4); } }

  /* ══════════ POST-PROCESSOR PANEL ══════════ */
  .pp-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-top: 20px;
  }
  .pp-panel .card-title { margin-bottom: 16px; }
  .pp-book-select {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 12px;
    margin-bottom: 14px; cursor: pointer;
  }
  .pp-book-select:focus { outline: none; border-color: var(--primary); }
  .pp-chapter-list {
    max-height: 360px; overflow-y: auto; margin-bottom: 14px;
  }
  .pp-chapter-list::-webkit-scrollbar { width: 4px; }
  .pp-chapter-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .pp-ch-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px; margin-bottom: 4px;
    background: var(--surface2); transition: all 0.2s; cursor: pointer;
  }
  .pp-ch-item:hover { background: #24283A; }
  .pp-ch-item.selected {
    background: rgba(231,65,15,0.12); border-left: 3px solid var(--primary);
  }
  .pp-ch-item input[type="checkbox"] {
    accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer;
  }
  .pp-ch-title { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-ch-meta { font-size: 10px; color: var(--text2); white-space: nowrap; }
  .pp-ch-status {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 9px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
  }
  .pp-ch-status.s2d { background: rgba(0,230,118,0.15); color: var(--green); }
  .pp-ch-status.s25d { background: rgba(68,138,255,0.15); color: var(--blue); }
  .pp-ch-status.s3d { background: rgba(0,230,118,0.2); color: var(--green); }
  .pp-ch-status.pp { background: rgba(245,166,35,0.15); color: var(--accent); }
  .pp-actions {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .pp-input {
    flex: 1; min-width: 120px; padding: 7px 12px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 11px;
  }
  .pp-input:focus { outline: none; border-color: var(--primary); }
  .pp-input::placeholder { color: var(--text2); }
  .pp-result {
    margin-top: 12px; padding: 12px; border-radius: 6px;
    font-size: 12px; display: none;
  }
  .pp-result.success { background: rgba(0,230,118,0.1); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .pp-result.error { background: rgba(255,23,68,0.1); color: var(--red); border: 1px solid rgba(255,23,68,0.2); }
  .pp-selected-count { font-size: 11px; color: var(--accent); font-weight: 600; }
  .pp-mode-switch { display: flex; gap: 4px; }
  .pp-mode-label { cursor: pointer; }
  .pp-mode-label input[type="radio"] { display: none; }
  .pp-mode-btn {
    display: inline-block; padding: 5px 12px; border-radius: 5px; font-size: 11px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    transition: all 0.2s;
  }
  .pp-mode-label input[type="radio"]:checked + .pp-mode-btn {
    background: rgba(231,65,15,0.15); border-color: var(--primary); color: var(--primary); font-weight: 600;
  }
  .pp-mode-options {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 6px 0;
  }
  .pp-opt-label { font-size: 11px; color: var(--text2); white-space: nowrap; }
  .pp-opt-hint { font-size: 10px; color: var(--text2); font-style: italic; }
  .pp-input-sm { flex: 0 0 60px !important; min-width: 60px !important; text-align: center; }
</style>
</head>
<body>
<div class="container">

  <!-- ══════ DASHBOARD ══════ -->
  <div class="dashboard" id="dashboard">
    <div class="dash-title-bar">
      <div class="dash-title-left">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#E7410F" stroke-width="1.5" opacity="0.8"/>
          <path d="M20 7 C20 7 11 15 11 24 C11 29.5 15 33.5 20 33.5 C25 33.5 29 29.5 29 24 C29 15 20 7 20 7 Z" fill="none" stroke="#E7410F" stroke-width="1.3" stroke-linejoin="round"/>
          <line x1="20" y1="10" x2="20" y2="32" stroke="#E7410F" stroke-width="0.8" opacity="0.6"/>
          <line x1="14" y1="21" x2="26" y2="21" stroke="#E7410F" stroke-width="0.8" opacity="0.6"/>
        </svg>
        <h1>知識加工廠<span class="sub">NERV SYSTEM v4</span></h1>
      </div>
      <div class="dash-title-right">
        <div class="gauge-row" id="gaugeRow">
          <div class="gauge"><div class="g-val" style="color:var(--text)" id="gTotal">—</div><div class="g-label">Total</div></div>
          <div class="gauge"><div class="g-val" style="color:var(--green)" id="gDone">—</div><div class="g-label">Cleared</div></div>
          <div class="gauge"><div class="g-val" style="color:var(--red)" id="gFailed">—</div><div class="g-label">Failed</div></div>
          <div class="gauge"><div class="g-val" style="color:var(--accent)" id="gPending">—</div><div class="g-label">Pending</div></div>
        </div>
        <button class="btn-settings" id="btnSettings" onclick="openSettings()">⚙ CONFIG</button>
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">STANDBY</span>
        </div>
      </div>
    </div>

    <div class="dash-target">
      <div class="target-row">
        <div class="target-book" id="targetBook">—</div>
        <div class="stage-badge" id="stageBadge">—</div>
      </div>
    </div>

    <div class="dash-progress">
      <div class="progress-row">
        <div class="progress-pct" id="progressPct">0%</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
          <div class="progress-segments">
            <div class="progress-seg-mark" style="width:5%"></div>
            <div class="progress-seg-mark" style="width:10%"></div>
            <div class="progress-seg-mark" style="width:70%"></div>
            <div class="progress-seg-mark" style="width:7%"></div>
            <div class="progress-seg-mark" style="width:8%"></div>
          </div>
        </div>
        <div class="progress-info">
          <div class="progress-chapter" id="progressChapter"></div>
          <div class="progress-eta" id="progressEta"></div>
        </div>
      </div>
    </div>
    <div class="progress-detail" id="progressDetail">
      <div class="progress-stage-info">
        <span class="stage-step" id="stageStep"></span>
        <span class="stage-avg" id="stageAvg"></span>
      </div>
    </div>

    <div class="dash-broadcast">
      <div class="broadcast-panel">
        <div class="broadcast-inner" id="broadcastBox">
          <div class="bc-line"><span class="bc-tag bc-info">&gt; STANDBY :</span> <span class="bc-info">等待指令...</span><span class="bc-cursor"></span></div>
        </div>
      </div>
    </div>

    <div class="dash-standby" id="dashStandby">
      ─── awaiting orders ── 将书籍放入 inbox/ 目录 ───<span class="bc-cursor" style="margin-left:8px;"></span>
    </div>

    <div class="control-bar">
      <div class="btn-group">
        <button class="btn btn-primary" id="btnStart" onclick="startTask()">▶ START</button>
        <button class="btn btn-outline" id="btnPause" onclick="pauseTask()" disabled>⏸ HOLD</button>
        <button class="btn btn-outline" id="btnResume" onclick="resumeTask()" disabled>▶ RESUME</button>
        <button class="btn btn-red" id="btnAbort" onclick="abortTask()" disabled>✖ ABORT</button>
        <button class="btn btn-outline" id="btnStop" onclick="stopAll()" disabled>⏹ ALL STOP</button>
      </div>
      <div class="inbox-hint">将书籍放入 <code>inbox/</code> 目录</div>
      <div class="concurrency-ctrl">
        <label>⚡ WORKERS</label>
        <input type="range" class="concurrency-slider" id="concSlider" min="1" max="8" value="3" oninput="concChange(this.value)">
        <span class="concurrency-val" id="concVal">3</span>
      </div>
    </div>
  </div>

  <!-- ══════ LOWER PANELS ══════ -->
  <div class="lower-grid">
    <div class="card">
      <div class="card-title">QUEUE <span id="queueCount" style="color:var(--text);font-size:14px;"></span></div>
      <ul class="queue-list" id="queueList">
        <li class="empty-state">LOADING...</li>
      </ul>
    </div>
    <div class="terminal">
      <div class="terminal-header">
        <div class="t-dot r"></div><div class="t-dot y"></div><div class="t-dot g"></div>
        <div class="terminal-title">MAGI SYSTEM — TERMINAL</div>
      </div>
      <div class="terminal-body" id="terminalBox">
        <div class="t-line" style="color:var(--text2);">&gt; SYSTEM READY<span class="t-cursor"></span></div>
      </div>
    </div>
  </div>

  <!-- ══════ POST-PROCESSOR ══════ -->
  <div class="pp-panel">
    <div class="card-title">POST-PROCESSOR <span style="color:var(--text);font-size:10px;margin-left:4px;">— 章节合并梳理</span></div>

    <select class="pp-book-select" id="ppBookSelect" onchange="ppLoadChapters()">
      <option value="">— 选择书籍 —</option>
    </select>

    <div class="pp-chapter-list" id="ppChapterList">
      <div class="empty-state">选择书籍后加载章节列表</div>
    </div>

    <div class="pp-actions">
      <span class="pp-selected-count" id="ppSelCount">已选 0 章</span>

      <div class="pp-mode-switch">
        <label class="pp-mode-label" title="将选中的多个章节整合压缩为 N 篇">
          <input type="radio" name="ppMode" value="merge" checked onchange="ppModeChange()">
          <span class="pp-mode-btn">📦 整合压缩</span>
        </label>
        <label class="pp-mode-label" title="逐篇优化格式，不合并内容">
          <input type="radio" name="ppMode" value="single" onchange="ppModeChange()">
          <span class="pp-mode-btn">📝 单篇优化</span>
        </label>
      </div>

      <div class="pp-mode-options" id="ppMergeOpts">
        <label class="pp-opt-label">目标篇数：</label>
        <input class="pp-input pp-input-sm" id="ppTargetCount" type="number" min="1" max="20" value="" placeholder="自动" title="留空则自动预判（3~7篇）" />
        <span class="pp-opt-hint" id="ppAutoHint"></span>
      </div>
      <div class="pp-mode-options" id="ppSingleOpts" style="display:none;">
        <span class="pp-opt-hint">将逐篇调用 LLM 优化格式与结构，不改变篇数</span>
      </div>

      <input class="pp-input" id="ppTitle" placeholder="输出标题（可选，默认取首章）" />
      <input class="pp-input" id="ppInstructions" placeholder="额外指令（可选）" />
      <button class="btn btn-primary" id="btnPostProcess" onclick="ppExecute()" disabled>优化</button>
    </div>

    <div class="pp-result" id="ppResult"></div>
  </div>

</div>

<!-- ══════ SETTINGS MODAL ══════ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <div class="modal-title">⚙ CONFIGURATION</div>
    <div class="modal-field">
      <label>API Key</label>
      <input type="password" id="cfgApiKey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
      <div class="field-status" id="cfgKeyStatus"></div>
    </div>
    <div class="modal-field">
      <label>Model</label>
      <input type="text" id="cfgModel" disabled />
    </div>
    <div class="modal-field">
      <label>API Base URL</label>
      <input type="text" id="cfgBaseUrl" disabled />
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeSettings()">CANCEL</button>
      <button class="btn btn-primary" id="btnSaveKey" onclick="saveApiKey()">SAVE</button>
    </div>
    <div class="field-status" id="cfgSaveMsg" style="text-align:center;margin-top:10px;"></div>
  </div>
</div>

<script>
let pollTimer = null;
let logOffset = 0;
let dragSrcEl = null;
let currentQueue = [];
let lastStatus = {};
let broadcastInited = false;

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

async function startTask() {
  if (!hasApiKey) { openSettings(); return; }
  const queue = currentQueue.map(f => f.name);
  const r = await api('/api/start', 'POST', { queue });
  if (!r.ok) alert(r.msg);
  refresh();
}
async function pauseTask() { await api('/api/pause','POST'); refresh(); }
async function resumeTask() { await api('/api/resume','POST'); refresh(); }
async function abortTask() {
  if (!confirm('ABORT CURRENT? All progress for this book will be lost.')) return;
  await api('/api/abort','POST'); refresh();
}
async function stopAll() { await api('/api/stop','POST'); refresh(); }

async function concChange(val) {
  document.getElementById('concVal').textContent = val;
  await api('/api/concurrency', 'POST', { value: parseInt(val) });
}

async function resetBook(name) {
  if (!confirm('RESET THIS BOOK? All progress and output will be cleared.')) return;
  await api('/api/reset/'+encodeURIComponent(name),'POST');
  loadInbox();
}

function classifyLine(text) {
  if (/Stage\s*\d/i.test(text) || text.includes('🔧') || text.includes('🧠') || text.includes('📝') || text.includes('🔍'))
    return { tag: 'STAGE', cls: 'bc-stage' };
  if (text.includes('✅') || text.includes('✓') || text.includes('完成') || text.includes('COMPLETE'))
    return { tag: 'COMPLETE', cls: 'bc-success' };
  if (text.includes('❌') || text.includes('错误') || text.includes('失败') || text.includes('ERROR'))
    return { tag: 'ERROR', cls: 'bc-error' };
  if (text.includes('⚠'))
    return { tag: 'WARNING', cls: 'bc-chapter' };
  if (/\[\d+\/\d+\]/.test(text))
    return { tag: 'PROCESS', cls: 'bc-chapter' };
  if (text.includes('📖') || text.includes('开始处理'))
    return { tag: 'SYSTEM', cls: 'bc-system' };
  if (text.includes('⏸') || text.includes('暂停'))
    return { tag: 'HOLD', cls: 'bc-chapter' };
  if (text.includes('▶') || text.includes('继续'))
    return { tag: 'RESUME', cls: 'bc-success' };
  if (text.includes('✖') || text.includes('放弃') || text.includes('重置'))
    return { tag: 'ABORT', cls: 'bc-error' };
  return { tag: 'INFO', cls: 'bc-info' };
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatBroadcastLine(raw) {
  const timeMatch = raw.match(/^(\d{2}:\d{2}:\d{2})\s+(.*)$/);
  let time = '', msg = raw;
  if (timeMatch) { time = timeMatch[1]; msg = timeMatch[2]; }
  const c = classifyLine(msg);
  const padTag = c.tag.padEnd(8);
  return `<span class="bc-time">${time}</span> <span class="bc-tag ${c.cls}">&gt; ${padTag}:</span> <span class="${c.cls}">${escHtml(msg)}</span>`;
}

function renderQueue(files) {
  currentQueue = files;
  const ul = document.getElementById('queueList');
  document.getElementById('queueCount').textContent = files.length ? `(${files.length})` : '';
  if (!files.length) { ul.innerHTML = '<li class="empty-state">INBOX EMPTY — DROP FILES TO BEGIN</li>'; return; }
  const curBook = lastStatus.current_book || '';
  ul.innerHTML = files.map((f, i) => {
    let cls = '', badge = '';
    const isProcessing = lastStatus.running && f.name === curBook;
    if (isProcessing) { cls = 'processing'; badge = '<span class="badge badge-processing">PROCESSING</span>'; }
    else if (f.status === 'pending') { badge = '<span class="badge badge-pending">STANDBY</span>'; }
    else if (f.status === 'stage3_done') { cls = 'done'; badge = '<span class="badge badge-done">CLEARED</span>'; }
    else if (f.status === 'stage2_5_done') { badge = '<span class="badge badge-processing">MERGED</span>'; }
    else if (f.status === 'failed') { cls = 'failed'; badge = '<span class="badge badge-failed">FAILED</span>'; }
    else { badge = '<span class="badge badge-processing">' + f.status.toUpperCase() + '</span>'; }
    const progress = f.chapters_total > 0 ? f.chapters_done + '/' + f.chapters_total + ' ch' : f.size;
    return '<li class="queue-item ' + cls + '" draggable="true" data-idx="' + i + '"'
      + ' ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)"'
      + ' ondrop="handleDrop(event)" ondragend="handleDragEnd(event)">'
      + '<div class="queue-item-info"><span class="drag-handle">⠿</span><div>'
      + '<div class="queue-item-name" title="' + escHtml(f.name) + '">' + (isProcessing ? '▸ ' : '') + escHtml(f.name) + '</div>'
      + '<div class="queue-item-meta">' + progress + '</div></div></div>'
      + '<div style="display:flex;align-items:center;gap:8px;">' + badge
      + '<button class="btn btn-outline btn-sm" onclick="resetBook(\'' + f.name.replace(/'/g,"\\'") + '\')">RESET</button>'
      + '</div></li>';
  }).join('');
}

function handleDragStart(e) { dragSrcEl = e.currentTarget; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', e.currentTarget.dataset.idx); }
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
function handleDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const fromIdx = parseInt(e.dataTransfer.getData('text/plain')); const toIdx = parseInt(e.currentTarget.dataset.idx); if (fromIdx !== toIdx) { const item = currentQueue.splice(fromIdx, 1)[0]; currentQueue.splice(toIdx, 0, item); renderQueue(currentQueue); } }
function handleDragEnd(e) { document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('dragging', 'drag-over')); }

function updateDashboard(s) {
  lastStatus = s;
  const dash = document.getElementById('dashboard');
  const isActive = s.running || !!s.current_book;
  isActive ? dash.classList.add('active') : dash.classList.remove('active');

  if (isActive) {
    document.getElementById('gTotal').textContent = s.total || 0;
    document.getElementById('gDone').textContent = s.done || 0;
    document.getElementById('gFailed').textContent = s.failed || 0;
    document.getElementById('gPending').textContent = Math.max(0, (s.total||0) - (s.done||0) - (s.failed||0));
  } else {
    ['gTotal','gDone','gFailed','gPending'].forEach(id => document.getElementById(id).textContent = '—');
  }

  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot';
  if (s.running && s.paused) { dot.classList.add('suspended'); txt.textContent = 'SUSPENDED'; txt.style.color = 'var(--yellow)'; }
  else if (s.running) { dot.classList.add('active'); txt.textContent = 'ACTIVE'; txt.style.color = 'var(--green)'; }
  else { txt.textContent = 'STANDBY'; txt.style.color = 'var(--text2)'; }

  if (isActive) {
    const bookName = s.current_book || '';
    document.getElementById('targetBook').textContent = bookName.length > 50 ? bookName.substring(0,50) + '...' : bookName;
    document.getElementById('targetBook').title = bookName;
    const stageMap = { 'Stage 0': 'STAGE 0 — PREPROCESS', 'Stage 1': 'STAGE 1 — DEEP READ', 'Stage 2.5': 'STAGE 2.5 — MERGE', 'Stage 2': 'STAGE 2 — MODELING', 'Stage 3': 'STAGE 3 — RETROSPECT' };
    let stageTxt = s.current_stage || '';
    for (const [k, v] of Object.entries(stageMap)) { if (stageTxt.includes(k)) { stageTxt = v; break; } }
    document.getElementById('stageBadge').textContent = stageTxt;

    // 使用后端计算的 overall_progress
    const pct = s.overall_progress || 0;
    document.getElementById('progressPct').textContent = pct + '%';
    const bar = document.getElementById('progressBar');
    bar.style.width = pct + '%';
    s.running && !s.paused ? bar.classList.add('animated') : bar.classList.remove('animated');
    document.getElementById('progressChapter').textContent = s.current_chapter || '';

    // ETA 显示
    const etaEl = document.getElementById('progressEta');
    if (s.eta_display) {
      etaEl.textContent = '⏱ ' + s.eta_display;
    } else {
      etaEl.textContent = '';
    }

    // Stage 详细进度
    const sp = s.stage_progress;
    const stepEl = document.getElementById('stageStep');
    const avgEl = document.getElementById('stageAvg');
    if (sp) {
      if (sp.step_total > 1) {
        stepEl.textContent = sp.name + ' [' + sp.step + '/' + sp.step_total + ']';
      } else {
        stepEl.textContent = sp.name;
      }
      if (sp.label) {
        stepEl.textContent += ' — ' + sp.label;
      }
    } else {
      stepEl.textContent = '';
    }
    if (s.avg_unit_time > 0 && s.total > 0) {
      avgEl.textContent = 'avg ' + s.avg_unit_time + 's/ch | ' + s.done + '/' + s.total + ' units';
    } else {
      avgEl.textContent = '';
    }
  }

  document.getElementById('btnStart').disabled = s.running;
  document.getElementById('btnPause').disabled = !s.running || s.paused;
  document.getElementById('btnResume').disabled = !s.running || !s.paused;
  document.getElementById('btnAbort').disabled = !s.running;
  document.getElementById('btnStop').disabled = !s.running;
  if (s.concurrency) { document.getElementById('concSlider').value = s.concurrency; document.getElementById('concVal').textContent = s.concurrency; }
}

async function loadLogs() {
  const r = await api('/api/logs?since=' + logOffset);
  if (r.lines.length > 0) {
    const bcBox = document.getElementById('broadcastBox');
    const termBox = document.getElementById('terminalBox');
    if (!broadcastInited) { bcBox.innerHTML = ''; termBox.innerHTML = ''; broadcastInited = true; }
    r.lines.forEach(line => {
      const bcDiv = document.createElement('div'); bcDiv.className = 'bc-line'; bcDiv.innerHTML = formatBroadcastLine(line); bcBox.appendChild(bcDiv);
      const tDiv = document.createElement('div'); tDiv.className = 't-line'; tDiv.textContent = '$ ' + line; termBox.appendChild(tDiv);
    });
    while (bcBox.children.length > 30) bcBox.removeChild(bcBox.firstChild);
    bcBox.querySelectorAll('.bc-cursor').forEach(c => c.remove());
    if (bcBox.lastElementChild) { const cur = document.createElement('span'); cur.className = 'bc-cursor'; bcBox.lastElementChild.appendChild(cur); }
    termBox.querySelectorAll('.t-cursor').forEach(c => c.remove());
    if (termBox.lastElementChild) { const cur = document.createElement('span'); cur.className = 'bc-cursor'; termBox.lastElementChild.appendChild(cur); }
    logOffset = r.total;
    bcBox.scrollTop = bcBox.scrollHeight;
    termBox.scrollTop = termBox.scrollHeight;
  }
}

// ── Post-Processor ──
let ppSelectedIndices = new Set();
let ppCurrentBook = '';

async function ppLoadBooks() {
  try {
    const books = await api('/api/books');
    const sel = document.getElementById('ppBookSelect');
    sel.innerHTML = '<option value="">— 选择书籍 —</option>';
    if (!Array.isArray(books) || books.length === 0) return;
    books.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.name;
      opt.textContent = b.name + ' (' + b.total + ' ch)';
      sel.appendChild(opt);
    });
  } catch(e) {
    console.error('[PP] ppLoadBooks error:', e);
  }
}

async function ppLoadChapters() {
  const bookName = document.getElementById('ppBookSelect').value;
  const listEl = document.getElementById('ppChapterList');
  ppSelectedIndices.clear();
  ppUpdateCount();

  if (!bookName) {
    listEl.innerHTML = '<div class="empty-state">选择书籍后加载章节列表</div>';
    ppCurrentBook = '';
    return;
  }

  ppCurrentBook = bookName;
  listEl.innerHTML = '<div class="empty-state">LOADING...</div>';

  const r = await api('/api/chapters/' + encodeURIComponent(bookName));
  if (!r.ok || !r.chapters.length) {
    listEl.innerHTML = '<div class="empty-state">暂无可用章节（需完成 Stage 2）</div>';
    return;
  }

  listEl.innerHTML = r.chapters.map(ch => {
    let statusCls = 'pp';
    if (ch.status === 'stage2_done') statusCls = 's2d';
    else if (ch.status === 'stage2_5_done') statusCls = 's25d';
    else if (ch.status === 'stage3_done') statusCls = 's3d';
    const statusLabel = ch.status.replace(/_/g, ' ').toUpperCase();
    const chars = ch.char_count > 0 ? (ch.char_count / 1000).toFixed(1) + 'k' : '';
    return '<div class="pp-ch-item" data-idx="' + ch.index + '" onclick="ppToggle(this)">'
      + '<input type="checkbox" onclick="event.stopPropagation()" onchange="ppCheckboxChange(this)">'
      + '<span class="pp-ch-title" title="' + escHtml(ch.title) + '">[' + ch.index + '] ' + escHtml(ch.title) + '</span>'
      + '<span class="pp-ch-meta">' + chars + '</span>'
      + '<span class="pp-ch-status ' + statusCls + '">' + statusLabel + '</span>'
      + (ch.has_output ? '<span class="pp-ch-meta" style="color:var(--green);">MD</span>' : '')
      + '</div>';
  }).join('');
}

function ppToggle(el) {
  const cb = el.querySelector('input[type="checkbox"]');
  cb.checked = !cb.checked;
  ppCheckboxChange(cb);
}

function ppCheckboxChange(cb) {
  const item = cb.closest('.pp-ch-item');
  const idx = item.dataset.idx;
  if (cb.checked) {
    ppSelectedIndices.add(idx);
    item.classList.add('selected');
  } else {
    ppSelectedIndices.delete(idx);
    item.classList.remove('selected');
  }
  ppUpdateCount();
}

function ppUpdateCount() {
  const n = ppSelectedIndices.size;
  document.getElementById('ppSelCount').textContent = '已选 ' + n + ' 章';
  document.getElementById('btnPostProcess').disabled = n < 1;
  ppUpdateAutoHint();
}

function ppGetMode() {
  const r = document.querySelector('input[name="ppMode"]:checked');
  return r ? r.value : 'merge';
}

function ppModeChange() {
  const mode = ppGetMode();
  document.getElementById('ppMergeOpts').style.display = mode === 'merge' ? 'flex' : 'none';
  document.getElementById('ppSingleOpts').style.display = mode === 'single' ? 'flex' : 'none';
  ppUpdateCount();
}

function ppUpdateAutoHint() {
  const n = ppSelectedIndices.size;
  const hint = document.getElementById('ppAutoHint');
  if (n < 2) { hint.textContent = ''; return; }
  let totalChars = 0;
  document.querySelectorAll('.pp-ch-item').forEach(el => {
    if (ppSelectedIndices.has(el.dataset.idx)) {
      const metaEl = el.querySelector('.pp-ch-meta');
      if (metaEl) {
        const m = metaEl.textContent.match(/([\\.\\d]+)k/);
        if (m) totalChars += parseFloat(m[1]) * 1000;
      }
    }
  });
  const lo = Math.max(1, Math.ceil(totalChars / 15000));
  const hi = Math.max(lo, Math.ceil(totalChars / 8000));
  const suggested = Math.min(7, Math.max(3, Math.round(totalChars / 10000)));
  hint.textContent = '(建议 ' + lo + '~' + hi + ' 篇，推荐 ' + suggested + ')';
}

async function ppExecute() {
  if (ppSelectedIndices.size < 1 || !ppCurrentBook) return;

  const mode = ppGetMode();
  const btn = document.getElementById('btnPostProcess');
  const resultEl = document.getElementById('ppResult');
  btn.disabled = true;
  btn.textContent = '处理中...';
  resultEl.style.display = 'none';

  const payload = {
    book_name: ppCurrentBook,
    indices: Array.from(ppSelectedIndices),
    output_title: document.getElementById('ppTitle').value.trim(),
    instructions: document.getElementById('ppInstructions').value.trim(),
    mode: mode,
  };

  if (mode === 'merge') {
    const tc = document.getElementById('ppTargetCount').value.trim();
    if (tc) payload.target_count = parseInt(tc, 10);
  }

  try {
    const r = await api('/api/post-process', 'POST', payload);
    resultEl.style.display = 'block';
    if (r.ok) {
      resultEl.className = 'pp-result success';
      resultEl.textContent = '✓ ' + r.msg + (r.output_file ? ' → ' + r.output_file : '');
      ppLoadChapters();
    } else {
      resultEl.className = 'pp-result error';
      resultEl.textContent = '✗ ' + r.msg;
    }
  } catch (e) {
    resultEl.style.display = 'block';
    resultEl.className = 'pp-result error';
    resultEl.textContent = '✗ 请求失败: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '优化';
  }
}

let hasApiKey = false;
async function loadConfig() {
  const r = await api('/api/config');
  hasApiKey = r.has_api_key;
  const btn = document.getElementById('btnSettings');
  if (!hasApiKey) { btn.classList.add('no-key'); btn.textContent = '⚠ SET API KEY'; }
  else { btn.classList.remove('no-key'); btn.textContent = '⚙ CONFIG'; }
  return r;
}
async function openSettings() {
  const r = await loadConfig();
  document.getElementById('cfgApiKey').value = '';
  document.getElementById('cfgModel').value = r.model || '';
  document.getElementById('cfgBaseUrl').value = r.api_base_url || '';
  const statusEl = document.getElementById('cfgKeyStatus');
  if (r.has_api_key) { statusEl.className = 'field-status ok'; statusEl.textContent = '✓ 当前: ' + r.api_key_masked; }
  else { statusEl.className = 'field-status missing'; statusEl.textContent = '✗ 未配置 — 必须先设置 API Key'; }
  document.getElementById('cfgSaveMsg').textContent = '';
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
async function saveApiKey() {
  const key = document.getElementById('cfgApiKey').value.trim();
  const msgEl = document.getElementById('cfgSaveMsg');
  if (!key) { msgEl.className = 'field-status missing'; msgEl.textContent = '请输入 API Key'; return; }
  const r = await api('/api/config', 'POST', { api_key: key });
  if (r.ok) { msgEl.className = 'field-status ok'; msgEl.textContent = '✓ ' + r.msg; await loadConfig(); setTimeout(closeSettings, 800); }
  else { msgEl.className = 'field-status missing'; msgEl.textContent = '✗ ' + r.msg; }
}
document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target === this) closeSettings(); });

async function loadInbox() { const files = await api('/api/inbox'); renderQueue(files); }
async function refresh() { const [status] = await Promise.all([api('/api/status'), loadInbox(), loadLogs()]); updateDashboard(status); }
refresh();
ppLoadBooks();
loadConfig().then(r => { if (!r.has_api_key) openSettings(); });
pollTimer = setInterval(refresh, 2000);
</script>
</body>

# 结构解析配置
# 修改此文件即可调整切割行为，无需改代码

# ── 策略优先级 ──
strategy_priority:
  - epub_native      # EPUB 原生目录（toc.ncx / nav.xhtml）
  - llm_toc          # LLM 解析目录页
  - regex_detect     # 正则标题模式检测

# ── 分块参数 ──
chunk:
  min_size: 1000       # 最小块字数，低于此值向上合并
  max_size: 12000      # 最大块字数，超过此值二次切割
  preferred_size: 8000  # 期望块字数
  merge_threshold: 1500 # 低于此值强制合并到相邻块

# ── 正则模式定义（按检测优先级排列）──
regex_patterns:
  chinese_pian_only:
    pattern: '^(第[一二三四五六七八九十百千零○〇0-9]+篇[^\n。，！？；]{0,40})\s*$'
    priority: 1
    description: "中文篇名（第X篇）"

  chinese_chapter:
    pattern: '^(第\s*[一二三四五六七八九十百千零○〇0-9]+\s*[篇章节卷回部编][^\n。，！？；]{0,40})\s*$'
    priority: 2
    description: "中文章节（第X章/节/卷/回/部/编）"

  english_chapter:
    pattern: '^((?:CHAPTER|Chapter|chapter)\s+\d+[^\n]*)'
    priority: 3
    description: "英文章节（Chapter N）"

  english_part:
    pattern: '^((?:PART|Part|part)\s+[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+[^\n]*)'
    priority: 4
    description: "英文篇名（PART N）"

  chinese_numbered:
    pattern: '^([一二三四五六七八九十百千]+[、.．]\s*[^\n]+)'
    priority: 5
    description: "中文数字编号（一、二、三）"

  numeric_dot:
    pattern: '^(\d{1,3}[.、．]\s+[^\n]+)'
    priority: 6
    description: "阿拉伯数字编号（1. 2. 3.）"

  markdown_h1:
    pattern: '^(#\s+[^\n]+)'
    priority: 7
    description: "Markdown 一级标题"

  markdown_h2:
    pattern: '^(##\s+[^\n]+)'
    priority: 8
    description: "Markdown 二级标题"

# ── 正则检测参数 ──
regex_detection:
  min_matches: 3          # 某模式至少匹配 N 次才视为有效
  skip_toc_chars: 3000    # 跳过前 N 字符（避免目录区干扰）
  fragment_threshold: 0.7 # 碎片率超过此值则排除当前模式

# ── TOC 解析参数（LLM 策略）──
toc_parsing:
  scan_chars: 6000        # 扫描前 N 字符寻找目录区域
  max_chars: 4000         # 送给 LLM 的目录区域最大长度
  min_entries: 3          # TOC 至少 N 个条目才算有效
  body_signal_len: 120    # 正文行长度阈值

# ── 文本清洗 ──
cleaning:
  remove_page_numbers: true
  normalize_whitespace: true
  strip_headers_footers: true

# ── 验证规则 ──
validation:
  preface:
    min_length: 500
    required_sections_min: 1
    min_links: 2
    section_markers: ["概述", "知识地图"]
  short:
    min_length: 800
    required_sections_min: 2
    min_links: 3
    section_markers: ["核心洞察", "概念建模", "金句"]
  normal:
    min_length: 1500
    required_sections_min: 3
    min_links: 5
    section_markers: ["核心洞察", "概念建模", "因果链", "行为准则", "金句"]
  long:
    min_length: 2000
    required_sections_min: 4
    min_links: 8
    section_markers: ["核心洞察", "概念建模", "因果链", "行为准则", "金句"]

  lazy_patterns: "以此类推|不再赘述|详见原文|此处省略|如前所述|同理可得"

  # 5 维评分权重
  scoring:
    length_weight: 0.25
    structure_weight: 0.35
    format_weight: 0.15
    links_weight: 0.15
    quotes_weight: 0.10

# ── 二次切割子模式 ──
sub_split_patterns:
  - '\n(第[一二三四五六七八九十百千零○〇0-9]+节\s*[^\n]+)'
  - '\n(#{2,4}\s+[^\n]+)'
  - '\n(\d+\.\d+[.、]?\s+[^\n]+)'
  - '\n([（(]\d+[)）][^\n]+)'

# ── 标题清洗正则 ──
title_cleaning:
  strip_markdown: '^#{1,4}\s+'
  strip_page_numbers: '[\s.·…]+\d{1,4}\s*$'
  strip_punctuation: '[，,。]'
  pian_pattern: '^(第\s*[一二三四五六七八九十百千零○〇0-9]+\s*篇)\s*(.*)'
  chapter_pattern: '^(第\s*[一二三四五六七八九十百千零○〇0-9]+\s*[节章卷回])\s*(.*)'

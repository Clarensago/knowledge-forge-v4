# 结构解析配置
# 修改此文件即可调整切割行为，无需改代码

# ── 策略优先级 ──
strategy_priority:
  - epub_native      # EPUB 原生目录（toc.ncx / nav.xhtml）
  - llm_toc          # LLM 解析目录页
  - regex_detect     # 正则标题模式检测

# ── 分块参数 ──
chunk:
  min_size: 500       # 最小块字数，低于此值向上合并
  max_size: 8000      # 最大块字数，超过此值二次切割
  preferred_size: 6000 # 期望块字数
  merge_threshold: 300 # 低于此值强制合并到相邻块

# ── 正则模式定义（按检测优先级排列）──
regex_patterns:
  chinese_pian_only:
    pattern: '^(第[一二三四五六七八九十百千零○〇0-9]+篇[^\n。，！？；]{0,40})\s*$'
    priority: 1
    description: "中文篇名（第X篇）"

  chinese_chapter:
    pattern: '^(第\s*[一二三四五六七八九十百千零○〇0-9]+\s*[篇章节卷回部编][^\n。，！？；]{0,40})\s*$'
    priority: 2
    description: "中文章节（第X章/节/卷/回/部/编）"

  english_chapter:
    pattern: '^((?:CHAPTER|Chapter|chapter)\s+\d+[^\n]*)'
    priority: 3
    description: "英文章节（Chapter N）"

  english_part:
    pattern: '^((?:PART|Part|part)\s+[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+[^\n]*)'
    priority: 4
    description: "英文篇名（PART N）"

  chinese_numbered:
    pattern: '^([一二三四五六七八九十百千]+[、.．]\s*[^\n]+)'
    priority: 5
    description: "中文数字编号（一、二、三）"

  numeric_dot:
    pattern: '^(\d{1,3}[.、．]\s+[^\n]+)'
    priority: 6
    description: "阿拉伯数字编号（1. 2. 3.）"

  markdown_h1:
    pattern: '^(#\s+[^\n]+)'
    priority: 7
    description: "Markdown 一级标题"

  markdown_h2:
    pattern: '^(##\s+[^\n]+)'
    priority: 8
    description: "Markdown 二级标题"

# ── 正则检测参数 ──
regex_detection:
  min_matches: 3          # 某模式至少匹配 N 次才视为有效
  skip_toc_chars: 3000    # 跳过前 N 字符（避免目录区干扰）
  fragment_threshold: 0.7 # 碎片率超过此值则排除当前模式

# ── TOC 解析参数（LLM 策略）──
toc_parsing:
  scan_chars: 6000        # 扫描前 N 字符寻找目录区域
  max_chars: 4000         # 送给 LLM 的目录区域最大长度
  min_entries: 3          # TOC 至少 N 个条目才算有效
  body_signal_len: 120    # 正文行长度阈值

# ── 文本清洗 ──
cleaning:
  remove_page_numbers: true
  normalize_whitespace: true
  strip_headers_footers: true
